<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal Login – Rahul Physio</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            600: '#0284c7',
                            700: '#0369a1'
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- FontAwesome & SweetAlert2 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="/static/css/custom.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full">
        <!-- Logo & Header -->
        <div class="text-center mb-8">
            <div class="w-16 h-16 rounded-3xl bg-gradient-to-tr from-sky-600 to-teal-500 flex items-center justify-center text-white text-3xl shadow-xl shadow-sky-600/30 mx-auto mb-4">
                <i class="fa-solid fa-user-doctor"></i>
            </div>
            <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">Rahul Physio</h1>
            <p class="text-xs font-semibold uppercase tracking-widest text-sky-400 mt-1">Management Portal</p>
        </div>

        <!-- Login Card -->
        <div class="bg-slate-800/90 border border-slate-700 rounded-3xl p-8 shadow-2xl backdrop-blur-md space-y-6">
            <div>
                <h2 class="text-lg font-bold text-white mb-1">Admin Authentication</h2>
                <p class="text-xs text-slate-400">Sign in to manage therapies, update pricing, and view booking requests.</p>
            </div>

            <form id="adminLoginForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">Username</label>
                    <div class="relative">
                        <i class="fa-solid fa-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
                        <input type="text" id="loginUsername" required placeholder="admin" 
                               class="w-full pl-11 pr-4 py-3 bg-slate-900/90 rounded-xl border border-slate-600 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">Password</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
                        <input type="password" id="loginPassword" required placeholder="••••••••" 
                               class="w-full pl-11 pr-4 py-3 bg-slate-900/90 rounded-xl border border-slate-600 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500">
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit" id="loginSubmitBtn"
                            class="w-full py-3.5 bg-sky-600 hover:bg-sky-500 text-white font-extrabold text-sm rounded-xl transition shadow-lg shadow-sky-600/30 flex items-center justify-center gap-2">
                        <i class="fa-solid fa-right-to-bracket"></i> Sign In to Dashboard
                    </button>
                </div>
            </form>

            <div class="pt-4 border-t border-slate-700/80 text-center">
                <a href="/" class="text-xs text-slate-400 hover:text-sky-400 font-medium transition inline-flex items-center gap-1.5">
                    <i class="fa-solid fa-arrow-left text-[10px]"></i> Back to Public Website
                </a>
            </div>
        </div>

        <p class="text-center text-xs text-slate-500 mt-6">
            Rahul Physio – Secure Healthcare Administration • Jaipur
        </p>
    </div>

    <script>
        document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginSubmitBtn');
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i> Authenticating...';

            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (res.ok && data.success) {
                    Swal.fire({
                        icon: 'success',
                        title: 'Welcome Back!',
                        text: 'Redirecting to Admin Dashboard...',
                        timer: 1200,
                        showConfirmButton: false
                    }).then(() => {
                        window.location.href = '/admin';
                    });
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Login Failed',
                        text: data.error || 'Invalid credentials',
                        confirmButtonColor: '#0284c7'
                    });
                }
            } catch (err) {
                Swal.fire({
                    icon: 'error',
                    title: 'Connection Error',
                    text: 'Unable to connect to server.',
                    confirmButtonColor: '#0284c7'
                });
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Sign In to Dashboard';
            }
        });
    </script>
</body>
</html>
